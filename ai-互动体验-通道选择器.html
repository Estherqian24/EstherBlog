<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小青·通道选择器｜第6课互动</title>
  <style>
    :root {
      --bg: #f4f7f8;
      --ink: #1a3a4a;
      --accent: #0d7a6f;
      --soft: #e6f3f1;
      --warn: #c45c26;
      --muted: #5a6a72;
      --line: #d0dae0;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #d9efe9 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 100% 100%, #e8eef2 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
    header h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.02em; }
    header p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .q { font-size: 22px; font-weight: 700; margin-bottom: 14px; line-height: 1.4; }
    .opts { display: grid; gap: 10px; }
    button.opt {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 18px;
      cursor: pointer;
      color: var(--ink);
      transition: border-color .15s, background .15s;
    }
    button.opt:hover { border-color: var(--accent); background: var(--soft); }
    button.opt.correct { border-color: var(--accent); background: var(--soft); }
    button.opt.wrong { border-color: var(--warn); background: #fff5ef; }
    .ai {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--soft);
      border-left: 4px solid var(--accent);
      font-size: 16px;
      line-height: 1.55;
    }
    .ai.show { display: block; }
    .ai strong { color: var(--accent); }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .bar button {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }
    .bar button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .progress { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
    .done { text-align: center; padding: 28px 12px; }
    .done h2 { margin: 0 0 10px; color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>小青 · 通道选择器</h1>
      <p>离线互动体验：像问 AI 一样选通道。老师可全班投屏，请学生举手后再点选项。</p>
    </header>
    <div class="panel" id="app"></div>
    <div class="bar">
      <button type="button" id="restart">重新开始</button>
      <button type="button" class="ghost" id="skip">跳过本题</button>
    </div>
  </div>
  <script>
    const items = [
      {
        q: "找车时，手机把位置/请求发给服务器，更合适的通道是？",
        options: ["只靠教室 Wi-Fi", "4G/5G 高速通道", "必须插网线"],
        answer: 1,
        ai: "小青：出门找车，手机常用 <strong>4G/5G</strong>。要快，人和服务器对话方便。"
      },
      {
        q: "单车向服务器上报“我在这儿”，更合适的通道是？",
        options: ["和手机一样一直用 5G", "NB-IoT 省电长跑通道", "蓝牙传十几千米"],
        answer: 1,
        ai: "小青：车多、电池小、数据小，适合 <strong>NB-IoT</strong>：省电、信号稳、传得远。"
      },
      {
        q: "扫码后，手机向服务器发送“请打开这辆车”，这是？",
        options: ["开锁指令", "开锁请求", "GPS 定位"],
        answer: 1,
        ai: "小青：手机→服务器，叫 <strong>开锁请求</strong>，一般走 4G/5G。"
      },
      {
        q: "服务器通知车锁打开，主要常走？",
        options: ["NB-IoT 发开锁指令", "学生喊一声就开", "只靠教室投影仪"],
        answer: 0,
        ai: "小青：服务器→单车，常经 <strong>NB-IoT</strong> 发开锁指令。"
      },
      {
        q: "地下车库信号差，手机和车锁贴身短连，补位靠？",
        options: ["光纤", "蓝牙短距通道", "卫星电视"],
        answer: 1,
        ai: "小青：弱网时 <strong>蓝牙</strong> 适合短距离、小数据，辅助开锁。"
      }
    ];

    let i = 0;
    const app = document.getElementById("app");

    function render() {
      if (i >= items.length) {
        app.innerHTML = `<div class="done"><h2>挑战完成</h2>
          <p>结论：一种通道不够，要按距离、功耗、场景配合使用。<br/>回到课堂：小青说“全用 Wi-Fi”完整吗？——不完整。</p></div>`;
        return;
      }
      const item = items[i];
      app.innerHTML = `
        <div class="progress">第 ${i + 1} / ${items.length} 题 · 模拟 AI 互动</div>
        <div class="q">${item.q}</div>
        <div class="opts">
          ${item.options.map((t, idx) => `<button class="opt" data-idx="${idx}">${String.fromCharCode(65 + idx)}. ${t}</button>`).join("")}
        </div>
        <div class="ai" id="ai"></div>
      `;
      app.querySelectorAll(".opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          const ai = document.getElementById("ai");
          app.querySelectorAll(".opt").forEach(b => { b.disabled = true; });
          if (idx === item.answer) {
            btn.classList.add("correct");
            ai.innerHTML = item.ai + "<br/><em>说得对！点“下一题”继续。</em>";
          } else {
            btn.classList.add("wrong");
            app.querySelectorAll(".opt")[item.answer].classList.add("correct");
            ai.innerHTML = item.ai + "<br/><em>选错也没关系，看小青讲解，再齐答一遍。</em>";
          }
          ai.classList.add("show");
          const next = document.createElement("button");
          next.textContent = i === items.length - 1 ? "查看总结" : "下一题";
          next.style.marginTop = "12px";
          next.style.border = "0";
          next.style.background = "var(--accent)";
          next.style.color = "#fff";
          next.style.borderRadius = "999px";
          next.style.padding = "10px 18px";
          next.style.cursor = "pointer";
          next.onclick = () => { i += 1; render(); };
          ai.appendChild(document.createElement("br"));
          ai.appendChild(next);
        });
      });
    }

    document.getElementById("restart").onclick = () => { i = 0; render(); };
    document.getElementById("skip").onclick = () => { i = Math.min(i + 1, items.length); render(); };
    render();
  </script>
</body>
</html>
